<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PARALLAX Watch</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <button class="hamburger" aria-label="Open menu" aria-expanded="false" onclick="toggleSidebar()"><span></span></button>
    <aside class="sidebar" id="sidebar">
      <h2>MENU</h2>
      <ul class="menu-list">
        <li><a href="/">Home</a></li>
        <li><a href="/community">Community</a></li>
        <li><a href="/videos">Videos</a></li>
        <li><a href="/chat">Chat</a></li>
        <li><a href="/upload">Upload</a></li>
        <li><a href="/auth">Account</a></li>
        <li><a href="/logout">Logout</a></li>
      </ul>
    </aside>

    <main class="page-wrap narrow">
      <div class="topbar">
        <div class="brand">
          <h1>PARALLAX Watch</h1>
          <p>Focused playback with creator details, actions, and comments.</p>
        </div>
      </div>

      <div class="video-shell">
        <section class="player-card">
          <div class="video-frame">
            <video id="watchVideo" controls autoplay muted playsinline></video>
          </div>
          <div class="player-info">
            <h1 class="player-title" id="videoTitle">Loading title...</h1>
            <div class="meta-row" id="videoMeta">Loading details...</div>
            <div class="profile-strip">
              <div class="profile-avatar"></div>
              <div class="profile-copy">
                <h3 id="videoAuthor">Creator</h3>
                <p id="videoTimestamp">Posted today</p>
              </div>
            </div>
            <div class="action-row">
              <button class="action-button" id="likeButton" type="button">Like</button>
              <button class="btn-secondary" id="shareButton" type="button">Share</button>
            </div>
            <p class="status-note" id="statusNote"></p>
          </div>
        </section>

        <section class="detail-panel">
          <h2>Description</h2>
          <p id="videoDescription">Loading video description...</p>
        </section>

        <section class="comments-panel">
          <h2>Comments</h2>
          <div class="comment-list" id="commentList"></div>
          <form id="commentForm" class="comment-form">
            <textarea id="commentText" placeholder="Add a comment..."></textarea>
            <button class="action-button" type="submit">Post comment</button>
          </form>
        </section>
      </div>
    </main>

    <script>
      const sidebar = document.getElementById("sidebar");
      const hamburger = document.querySelector(".hamburger");
      const watchVideo = document.getElementById("watchVideo");
      const videoTitle = document.getElementById("videoTitle");
      const videoMeta = document.getElementById("videoMeta");
      const videoAuthor = document.getElementById("videoAuthor");
      const videoTimestamp = document.getElementById("videoTimestamp");
      const videoDescription = document.getElementById("videoDescription");
      const commentList = document.getElementById("commentList");
      const commentForm = document.getElementById("commentForm");
      const commentText = document.getElementById("commentText");
      const statusNote = document.getElementById("statusNote");
      const likeButton = document.getElementById("likeButton");
      const shareButton = document.getElementById("shareButton");
      const videoId = new URLSearchParams(window.location.search).get("id");
      let currentVideo = null;

      function toggleSidebar() {
        const isOpen = sidebar.classList.toggle("open");
        hamburger.classList.toggle("is-open", isOpen);
        hamburger.setAttribute("aria-expanded", String(isOpen));
      }

      document.addEventListener("click", (event) => {
        if (!sidebar.contains(event.target) && !hamburger.contains(event.target) && sidebar.classList.contains("open")) {
          toggleSidebar();
        }
      });

      const api = async (url, options = {}) => {
        const res = await fetch(url, options);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw data;
        return data;
      };

      const escapeHtml = (value = "") => value.replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));

      const formatTime = (timestamp) => new Date(timestamp).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });

      const renderComments = (comments) => {
        if (!comments || !comments.length) {
          commentList.innerHTML = `<div class="comment-card"><strong>No comments yet</strong><p>Be the first to start the conversation.</p></div>`;
          return;
        }
        commentList.innerHTML = comments.map((comment) => `
          <div class="comment-card">
            <strong>${escapeHtml(comment.author)}</strong>
            <p>${escapeHtml(comment.text)}</p>
          </div>
        `).join("");
      };

      const loadVideo = async () => {
        if (!videoId) {
          statusNote.textContent = "Missing video ID in the URL.";
          return;
        }
        try {
          const data = await api(`/api/community/videos/${videoId}`);
          currentVideo = data.video;
          watchVideo.src = currentVideo.videoUrl;
          videoTitle.textContent = currentVideo.title;
          videoMeta.textContent = `${currentVideo.views || 0} views · ${currentVideo.likes || 0} likes · ${formatTime(currentVideo.timestamp)}`;
          videoAuthor.textContent = currentVideo.author;
          videoTimestamp.textContent = `Published ${formatTime(currentVideo.timestamp)}`;
          videoDescription.textContent = currentVideo.description;
          renderComments(currentVideo.comments);
          statusNote.textContent = "";
        } catch (err) {
          statusNote.textContent = err.error || "Could not load this video.";
        }
      };

      likeButton.addEventListener("click", async () => {
        if (!currentVideo) return;
        try {
          await api(`/api/community/videos/${currentVideo.id}/react`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ reaction: "like" })
          });
          await loadVideo();
        } catch (err) {
          statusNote.textContent = err.error || "Unable to like video.";
        }
      });

      shareButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(window.location.href);
          statusNote.textContent = "Link copied to clipboard.";
        } catch (err) {
          statusNote.textContent = "Copy failed. Please copy the URL manually.";
        }
      });

      commentForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!currentVideo) return;
        const text = commentText.value.trim();
        if (!text) return;
        try {
          await api(`/api/community/videos/${currentVideo.id}/comment`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ comment: text })
          });
          commentText.value = "";
          await loadVideo();
        } catch (err) {
          statusNote.textContent = err.error || "Unable to post comment.";
        }
      });

      loadVideo();
    </script>
  </body>
</html>
