<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PARALLAX Chat</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .chat-panel {
        display: grid;
        gap: 1.3rem;
        min-height: calc(100vh - 9rem);
      }

      .chat-box {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        min-height: min(720px, calc(100vh - 18rem));
      }

      .typing-row {
        min-height: 1.4rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: #87fca0;
        font-size: 0.86rem;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .typing-row.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .typing-dots {
        display: inline-flex;
        gap: 0.22rem;
      }

      .typing-dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #7fff9a;
        animation: typing-bounce 1.1s infinite ease-in-out;
      }

      .typing-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .typing-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      .messages {
        flex: 1;
        min-height: 260px;
        display: grid;
        align-content: start;
        gap: 1rem;
        overflow-y: auto;
        padding-right: 0.25rem;
        scroll-behavior: smooth;
      }

      .message {
        padding: 1rem 1.15rem;
        border: 1px solid rgba(89, 255, 130, 0.16);
        border-radius: 22px;
        background: rgba(36, 58, 37, 0.92);
        animation: message-in 0.32s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }

      .message.own {
        border-color: rgba(89, 255, 130, 0.35);
        background: rgba(49, 255, 140, 0.14);
      }

      .message strong,
      .message time {
        display: block;
      }

      .message strong {
        margin-bottom: 0.35rem;
        color: #d9ffdf;
      }

      .message .text {
        color: #c6ffd4;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .message .attachment {
        margin-top: 0.7rem;
        overflow: hidden;
        max-width: 360px;
        border: 1px solid var(--color-border);
        border-radius: 16px;
      }

      .message .attachment img,
      .message .attachment video {
        display: block;
        width: 100%;
        height: auto;
      }

      .message time {
        margin-top: 0.7rem;
        color: #87fca0;
        font-size: 0.82rem;
      }

      .attach-preview {
        display: none;
        align-items: center;
        gap: 0.75rem;
        padding: 0.7rem 0.85rem;
        border: 1px solid rgba(125, 255, 154, 0.2);
        border-radius: 16px;
        background: rgba(11, 22, 12, 0.92);
      }

      .attach-preview.visible {
        display: flex;
      }

      .attach-preview .meta {
        flex: 1;
        display: grid;
        gap: 0.25rem;
        color: var(--color-text-muted);
        font-size: 0.85rem;
      }

      .progress {
        height: 4px;
        overflow: hidden;
        border-radius: var(--radius-full);
        background: rgba(255, 255, 255, 0.08);
      }

      .progress-bar {
        display: block;
        width: 0;
        height: 100%;
        background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
        transition: width 0.2s ease;
      }

      .remove-attach,
      .tool-btn {
        display: grid;
        place-items: center;
        width: 2.6rem;
        height: 2.6rem;
        border-radius: 14px;
        cursor: pointer;
      }

      .remove-attach {
        border: 0;
        background: rgba(255, 90, 90, 0.14);
        color: #ffb2b2;
        font-weight: 800;
      }

      .chat-form-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .toolbar {
        display: flex;
        gap: 0.55rem;
      }

      .gif-picker {
        display: none;
        grid-template-columns: 1fr;
        gap: 0.65rem;
        max-height: 340px;
        padding: 0.85rem;
        border: 1px solid rgba(125, 255, 154, 0.2);
        border-radius: 18px;
        background: rgba(6, 12, 7, 0.96);
      }

      .gif-picker.visible {
        display: grid;
      }

      .gif-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
        gap: 0.5rem;
        overflow-y: auto;
        max-height: 230px;
      }

      .gif-grid button {
        aspect-ratio: 1 / 1;
        overflow: hidden;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
        cursor: pointer;
      }

      .gif-grid img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .toast-stack {
        position: fixed;
        top: 1.2rem;
        right: 1.2rem;
        z-index: 50;
        display: grid;
        gap: 0.6rem;
      }

      .toast {
        min-width: 220px;
        max-width: 280px;
        padding: 0.8rem 1rem;
        border: 1px solid rgba(89, 255, 130, 0.35);
        border-radius: 16px;
        background: rgba(8, 16, 9, 0.95);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        animation: fade-up 0.3s ease both;
      }

      .toast strong {
        display: block;
        color: #9dffb2;
        font-size: 0.88rem;
      }

      .toast span {
        color: #c9ffd6;
        font-size: 0.85rem;
      }

      @keyframes typing-bounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
        30% { transform: translateY(-4px); opacity: 1; }
      }

      @media (max-width: 720px) {
        .chat-form-row {
          align-items: stretch;
          flex-direction: column;
        }

        .chat-form-row .btn-primary {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <button class="hamburger" aria-label="Open menu" aria-expanded="false" onclick="toggleSidebar()"><span></span></button>
    <aside class="sidebar" id="sidebar">
      <h2>MENU</h2>
      <ul class="menu-list">
        <li><a href="/">Home</a></li>
        <li><a href="/community">Community</a></li>
        <li><a href="/videos">Videos</a></li>
        <li><a class="active" href="/chat">Chat</a></li>
        <li><a href="/upload">Upload</a></li>
        <li><a href="/auth">Account</a></li>
        <li><a href="/logout">Logout</a></li>
      </ul>
    </aside>

    <div class="toast-stack" id="toastStack"></div>

    <main class="page-wrap">
      <div class="topbar">
        <div class="brand">
          <h1>PARALLAX</h1>
          <p>Live chat with full messages, media, GIFs, and typing state.</p>
        </div>
        <button class="notify-btn" id="notifyBtn" type="button" onclick="toggleNotifications()">
          <span id="notifyLabel">Enable notifications</span>
        </button>
      </div>

      <section class="chat-panel">
        <div class="panel chat-box">
          <div class="typing-row" id="typingRow">
            <span class="typing-dots"><span></span><span></span><span></span></span>
            <span id="typingText"></span>
          </div>
          <div class="messages" id="messages">
            <div class="empty-state"><strong>No messages yet</strong><span>Start the conversation when you are ready.</span></div>
          </div>
          <form class="chat-form form" id="chatForm">
            <div class="gif-picker" id="gifPicker">
              <input type="text" id="gifSearch" placeholder="Search Tenor GIFs..." />
              <div class="gif-grid" id="gifGrid"></div>
            </div>
            <div class="attach-preview" id="attachPreview">
              <span class="meta">
                <span id="attachName">Uploading...</span>
                <span class="progress"><span class="progress-bar" id="attachProgress"></span></span>
              </span>
              <button type="button" class="remove-attach" id="attachRemove" title="Remove attachment">X</button>
            </div>
            <textarea id="messageInput" placeholder="Write a message..."></textarea>
            <div class="chat-form-row">
              <div class="toolbar">
                <button type="button" class="tool-btn" id="gifToggle" title="Send a GIF">GIF</button>
                <button type="button" class="tool-btn" id="mediaToggle" title="Attach media">+</button>
                <input type="file" id="mediaInput" accept="image/*,video/*" hidden />
              </div>
              <button class="btn-primary" type="submit" id="sendBtn">Send message</button>
            </div>
          </form>
        </div>
        <p class="user-note" id="userNote">Loading user...</p>
      </section>
    </main>

    <script>
      const CLOUDINARY_CLOUD_NAME = "dcbo4oozo";
      const CLOUDINARY_UPLOAD_PRESET = "REPLACE_WITH_YOUR_UNSIGNED_PRESET";
      const CLOUDINARY_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
      const TENOR_API_KEY = "REPLACE_WITH_YOUR_TENOR_API_KEY";
      const TENOR_CLIENT_KEY = "parallax_chat";

      const messagesEl = document.getElementById("messages");
      const chatForm = document.getElementById("chatForm");
      const messageInput = document.getElementById("messageInput");
      const userNote = document.getElementById("userNote");
      const sidebar = document.getElementById("sidebar");
      const hamburger = document.querySelector(".hamburger");
      const sendBtn = document.getElementById("sendBtn");
      const gifToggle = document.getElementById("gifToggle");
      const gifPicker = document.getElementById("gifPicker");
      const gifSearch = document.getElementById("gifSearch");
      const gifGrid = document.getElementById("gifGrid");
      const mediaToggle = document.getElementById("mediaToggle");
      const mediaInput = document.getElementById("mediaInput");
      const attachPreview = document.getElementById("attachPreview");
      const attachName = document.getElementById("attachName");
      const attachProgress = document.getElementById("attachProgress");
      const attachRemove = document.getElementById("attachRemove");
      const typingRow = document.getElementById("typingRow");
      const typingText = document.getElementById("typingText");
      const notifyBtn = document.getElementById("notifyBtn");
      const notifyLabel = document.getElementById("notifyLabel");
      const toastStack = document.getElementById("toastStack");

      let username = "";
      let pendingAttachment = null;
      let knownMessageKeys = new Set();
      let firstLoad = true;
      let typingTimeout = null;
      let gifSearchTimeout = null;

      function toggleSidebar() {
        const isOpen = sidebar.classList.toggle("open");
        hamburger.classList.toggle("is-open", isOpen);
        hamburger.setAttribute("aria-expanded", String(isOpen));
      }

      document.addEventListener("click", (event) => {
        if (!sidebar.contains(event.target) && !hamburger.contains(event.target) && sidebar.classList.contains("open")) {
          toggleSidebar();
        }
      });

      function showToast(title, body) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.innerHTML = "<strong></strong><span></span>";
        toast.querySelector("strong").textContent = title;
        toast.querySelector("span").textContent = body;
        toastStack.appendChild(toast);
        setTimeout(() => toast.remove(), 4500);
      }

      function updateNotifyButton() {
        const enabled = "Notification" in window && Notification.permission === "granted";
        notifyBtn.dataset.state = enabled ? "on" : "off";
        notifyLabel.textContent = enabled ? "Notifications on" : "Enable notifications";
      }

      async function toggleNotifications() {
        if (!("Notification" in window)) {
          showToast("Not supported", "Your browser does not support notifications.");
          return;
        }
        if (Notification.permission === "granted") {
          showToast("Notifications", "Notifications are already on.");
          return;
        }
        const permission = await Notification.requestPermission();
        updateNotifyButton();
        if (permission === "granted") showToast("Notifications on", "You will be notified about new messages.");
      }

      function notifyNewMessage(message) {
        if (document.hasFocus()) return;
        if (!("Notification" in window) || Notification.permission !== "granted") return;
        const body = !message.type || message.type === "text" ? message.message || "" : `sent a ${message.type}`;
        const notification = new Notification(`${message.name} - PARALLAX`, { body: body.slice(0, 120), silent: false });
        notification.onclick = () => {
          window.focus();
          notification.close();
        };
      }

      async function loadUser() {
        const res = await fetch("/api/auth/me");
        if (!res.ok) {
          window.location.href = "/auth";
          return;
        }
        const data = await res.json();
        username = data.username;
        userNote.textContent = `Signed in as ${username}`;
      }

      function renderAttachment(message) {
        if (!message.type || message.type === "text") return "";
        const url = message.attachmentUrl || message.url;
        if (!url) return "";
        if (message.type === "video") return `<div class="attachment"><video src="${url}" controls playsinline></video></div>`;
        return `<div class="attachment"><img src="${url}" alt="attachment" loading="lazy" /></div>`;
      }

      function messageKey(message) {
        return message.id || `${message.name}|${message.timestamp}|${message.message || message.url || ""}`;
      }

      async function loadMessages() {
        const res = await fetch("/api/chat/messages");
        if (!res.ok) {
          window.location.href = "/auth";
          return;
        }
        const data = await res.json();
        const wasAtBottom = messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 20;
        const newKeys = new Set();
        messagesEl.innerHTML = "";

        if (!data.messages.length) {
          messagesEl.innerHTML = `<div class="empty-state"><strong>No messages yet</strong><span>Start the conversation when you are ready.</span></div>`;
        }

        data.messages.forEach((message) => {
          const key = messageKey(message);
          newKeys.add(key);
          const isNew = !firstLoad && !knownMessageKeys.has(key);
          const messageEl = document.createElement("div");
          messageEl.className = "message" + (message.name === username ? " own" : "");
          if (!isNew) messageEl.style.animation = "none";

          const author = document.createElement("strong");
          author.textContent = message.name;
          const text = document.createElement("div");
          text.className = "text";
          text.textContent = message.message || "";
          const time = document.createElement("time");
          time.textContent = new Date(message.timestamp).toLocaleString();

          messageEl.appendChild(author);
          if (message.message) messageEl.appendChild(text);
          messageEl.insertAdjacentHTML("beforeend", renderAttachment(message));
          messageEl.appendChild(time);
          messagesEl.appendChild(messageEl);
          if (isNew && message.name !== username) notifyNewMessage(message);
        });

        knownMessageKeys = newKeys;
        firstLoad = false;
        if (wasAtBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      async function pollTyping() {
        try {
          const res = await fetch("/api/chat/typing");
          if (!res.ok) return;
          const data = await res.json();
          const others = (data.typers || []).filter((name) => name !== username);
          if (!others.length) {
            typingRow.classList.remove("visible");
            typingText.textContent = "";
            return;
          }
          typingText.textContent = others.length === 1 ? `${others[0]} is typing` : `${others.length} people are typing`;
          typingRow.classList.add("visible");
        } catch (err) {
          typingRow.classList.remove("visible");
        }
      }

      function notifyTypingState(isTyping) {
        fetch("/api/chat/typing", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ typing: isTyping })
        }).catch(() => {});
      }

      messageInput.addEventListener("input", () => {
        notifyTypingState(true);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => notifyTypingState(false), 2000);
      });

      function toggleGifPicker(forceOpen) {
        const open = forceOpen ?? !gifPicker.classList.contains("visible");
        gifPicker.classList.toggle("visible", open);
        if (open) {
          gifSearch.focus();
          if (!gifGrid.childElementCount) searchGifs("trending");
        }
      }

      gifToggle.addEventListener("click", () => toggleGifPicker());

      async function searchGifs(query) {
        gifGrid.innerHTML = `<div class="empty-state">Searching...</div>`;
        if (!TENOR_API_KEY || TENOR_API_KEY.startsWith("REPLACE_")) {
          gifGrid.innerHTML = `<div class="empty-state">Add a Tenor API key in chat.html to enable GIF search.</div>`;
          return;
        }
        const endpoint = query === "trending"
          ? `https://tenor.googleapis.com/v2/featured?key=${TENOR_API_KEY}&client_key=${TENOR_CLIENT_KEY}&limit=18`
          : `https://tenor.googleapis.com/v2/search?q=${encodeURIComponent(query)}&key=${TENOR_API_KEY}&client_key=${TENOR_CLIENT_KEY}&limit=18`;
        try {
          const res = await fetch(endpoint);
          const data = await res.json();
          gifGrid.innerHTML = "";
          if (!data.results || !data.results.length) {
            gifGrid.innerHTML = `<div class="empty-state">No GIFs found.</div>`;
            return;
          }
          data.results.forEach((gif) => {
            const previewUrl = gif.media_formats?.tinygif?.url || gif.media_formats?.gif?.url;
            const fullUrl = gif.media_formats?.gif?.url || previewUrl;
            if (!previewUrl) return;
            const btn = document.createElement("button");
            btn.type = "button";
            btn.innerHTML = `<img src="${previewUrl}" alt="${gif.content_description || "GIF"}" loading="lazy" />`;
            btn.addEventListener("click", () => selectGif(fullUrl));
            gifGrid.appendChild(btn);
          });
        } catch (err) {
          gifGrid.innerHTML = `<div class="empty-state">Could not reach Tenor. Try again later.</div>`;
        }
      }

      gifSearch.addEventListener("input", () => {
        clearTimeout(gifSearchTimeout);
        const query = gifSearch.value.trim();
        gifSearchTimeout = setTimeout(() => searchGifs(query || "trending"), 350);
      });

      function setAttachment(attachment) {
        pendingAttachment = attachment;
        attachPreview.classList.add("visible");
        attachName.textContent = attachment.label || attachment.url;
        attachProgress.style.width = "100%";
      }

      function selectGif(url) {
        setAttachment({ type: "gif", url, label: "GIF selected" });
        toggleGifPicker(false);
      }

      mediaToggle.addEventListener("click", () => mediaInput.click());
      mediaInput.addEventListener("change", async () => {
        const file = mediaInput.files[0];
        if (!file) return;
        await uploadToCloudinary(file);
        mediaInput.value = "";
      });

      attachRemove.addEventListener("click", () => {
        pendingAttachment = null;
        attachPreview.classList.remove("visible");
        attachProgress.style.width = "0%";
      });

      async function uploadToCloudinary(file) {
        if (CLOUDINARY_UPLOAD_PRESET.startsWith("REPLACE_")) {
          showToast("Setup needed", "Add an unsigned Cloudinary upload preset in chat.html first.");
          return;
        }
        attachPreview.classList.add("visible");
        attachName.textContent = `Uploading ${file.name}...`;
        attachProgress.style.width = "10%";
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

        try {
          const result = await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open("POST", CLOUDINARY_UPLOAD_URL);
            xhr.upload.onprogress = (event) => {
              if (event.lengthComputable) attachProgress.style.width = `${Math.round((event.loaded / event.total) * 100)}%`;
            };
            xhr.onload = () => xhr.status >= 200 && xhr.status < 300 ? resolve(JSON.parse(xhr.responseText)) : reject(new Error("Upload failed"));
            xhr.onerror = () => reject(new Error("Upload failed"));
            xhr.send(formData);
          });
          setAttachment({ type: result.resource_type === "video" ? "video" : "image", url: result.secure_url, label: file.name });
        } catch (err) {
          attachPreview.classList.remove("visible");
          showToast("Upload failed", "Could not upload that file. Please try again.");
        }
      }

      async function sendMessage(event) {
        event.preventDefault();
        const message = messageInput.value.trim();
        if (!message && !pendingAttachment) return;
        sendBtn.disabled = true;
        clearTimeout(typingTimeout);
        notifyTypingState(false);

        const payload = { message };
        if (pendingAttachment) {
          payload.type = pendingAttachment.type;
          payload.attachmentUrl = pendingAttachment.url;
        }

        try {
          const res = await fetch("/api/chat/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (!res.ok) {
            window.location.href = "/auth";
            return;
          }
          messageInput.value = "";
          pendingAttachment = null;
          attachPreview.classList.remove("visible");
          attachProgress.style.width = "0%";
          await loadMessages();
        } finally {
          sendBtn.disabled = false;
        }
      }

      chatForm.addEventListener("submit", sendMessage);
      messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage(event);
        }
      });

      updateNotifyButton();
      loadUser().then(loadMessages);
      setInterval(loadMessages, 5000);
      setInterval(pollTyping, 2000);
    </script>
  </body>
</html>
