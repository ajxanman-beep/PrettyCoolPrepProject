<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PARALLAX Video Feed</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <button class="hamburger" aria-label="Open menu" aria-expanded="false" onclick="toggleSidebar()"><span></span></button>
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>
    <aside class="sidebar" id="sidebar">
      <h2>MENU</h2>
      <ul class="menu-list">
        <li><a href="/">Home</a></li>
        <li><a href="/community">Community</a></li>
        <li><a href="/chat">Chat</a></li>
        <li><a href="/auth">Account</a></li>
        <li><a href="/logout">Logout</a></li>
      </ul>
    </aside>

    <main class="page-wrap">
      <div class="topbar">
        <div class="brand">
          <h1>PARALLAX Video Feed</h1>
          <p>Search, browse, and watch community videos in a dedicated grid.</p>
        </div>
        <div class="search-bar" style="min-width: min(100%, 320px);">
          <label for="searchInput">Search</label>
          <input id="searchInput" placeholder="Search videos or creators..." />
        </div>
      </div>

      <section class="panel-hero">
        <h2>Video Feed</h2>
        <p>Cards scale from one column to a full responsive grid and open into the watch page.</p>
      </section>

      <section id="videoList" class="video-grid">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </section>
    </main>

    <script>
      const sidebar = document.getElementById("sidebar");
      const hamburger = document.querySelector(".hamburger");
      const sidebarBackdrop = document.getElementById("sidebarBackdrop");
      const searchInput = document.getElementById("searchInput");
      const videoList = document.getElementById("videoList");
      let cachedVideos = [];

      function toggleSidebar(forceState) {
        const isOpen = typeof forceState === "boolean" ? forceState : !sidebar.classList.contains("open");
        sidebar.classList.toggle("open", isOpen);
        hamburger.classList.toggle("is-open", isOpen);
        hamburger.setAttribute("aria-expanded", String(isOpen));
        if (sidebarBackdrop) sidebarBackdrop.classList.toggle("visible", isOpen);
      }

      document.addEventListener("click", (event) => {
        if (!sidebar.contains(event.target) && !hamburger.contains(event.target) && sidebar.classList.contains("open")) {
          toggleSidebar(false);
        }
      });

      const api = async (url, options = {}) => {
        const res = await fetch(url, options);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw data;
        return data;
      };

      const escapeHtml = (value = "") => value.replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));

      const getRelativeTime = (timestamp) => {
        const diff = Date.now() - new Date(timestamp).getTime();
        const minutes = Math.floor(diff / 60000);
        if (minutes < 1) return "just now";
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h ago`;
        return `${Math.floor(hours / 24)}d ago`;
      };

      const renderVideoList = (videos) => {
        if (!videos.length) {
          videoList.innerHTML = `<div class="empty-state"><strong>No videos found</strong><span>Upload the first video or clear your search.</span></div>`;
          return;
        }
        videoList.innerHTML = videos.map((video) => `
          <article class="video-card">
            <a href="/watch?id=${video.id}">
              <h3>${escapeHtml(video.title)}</h3>
              <p>${escapeHtml(video.description)}</p>
              <div class="video-meta">Posted by ${escapeHtml(video.author)} · ${getRelativeTime(video.timestamp)}</div>
              <span class="watch-button">Open watch page</span>
            </a>
          </article>
        `).join("");
      };

      const refreshFeed = async () => {
        cachedVideos = (await api("/api/community/videos")).videos;
        renderVideoList(cachedVideos);
      };

      searchInput.addEventListener("input", () => {
        const lower = searchInput.value.trim().toLowerCase();
        const filtered = lower ? cachedVideos.filter((video) => video.title.toLowerCase().includes(lower) || video.author.toLowerCase().includes(lower)) : cachedVideos;
        renderVideoList(filtered);
      });

      refreshFeed();
    </script>
  </body>
</html>
