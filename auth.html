<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PARALLAX Auth</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <button class="hamburger" aria-label="Open menu" aria-expanded="false" onclick="toggleSidebar()"><span></span></button>
    <aside class="sidebar" id="sidebar">
      <h2>MENU</h2>
      <ul class="menu-list">
        <li><a href="/">Home</a></li>
        <li><a href="/community">Community</a></li>
        <li><a href="/videos">Videos</a></li>
        <li><a href="/chat">Chat</a></li>
        <li><a href="/upload">Upload</a></li>
        <li><a class="active" href="/auth">Account</a></li>
        <li><a href="/logout">Logout</a></li>
      </ul>
    </aside>

    <main class="page-wrap centered">
      <section class="panel auth-wrap">
        <div class="title-row">
          <h1>PARALLAX</h1>
          <p>Log in or sign up to access the community.</p>
        </div>

        <div class="tabs" role="tablist">
          <button class="tab active" id="loginTab" type="button">Log in</button>
          <button class="tab" id="signupTab" type="button">Sign up</button>
        </div>

        <form class="form" id="authForm">
          <div class="field">
            <input type="text" id="username" autocomplete="username" required />
            <label for="username">Username</label>
          </div>
          <div class="field password-field">
            <input type="password" id="password" autocomplete="current-password" required />
            <label for="password">Password</label>
            <button type="button" class="toggle-password" id="togglePassword">Show</button>
          </div>
          <input type="hidden" id="redirectTarget" name="redirectTarget" value="/chat" />
          <button class="btn-primary" type="submit" id="submitButton">Log in</button>
        </form>

        <p class="notice" id="noticeText">Use the same username as your chat name.</p>
        <p class="error" id="errorText" style="display:none;"></p>
        <p class="success" id="successText" style="display:none;"></p>
      </section>
    </main>

    <script>
      const loginTab = document.getElementById("loginTab");
      const signupTab = document.getElementById("signupTab");
      const authForm = document.getElementById("authForm");
      const submitButton = document.getElementById("submitButton");
      const errorText = document.getElementById("errorText");
      const successText = document.getElementById("successText");
      const passwordInput = document.getElementById("password");
      const togglePassword = document.getElementById("togglePassword");
      const sidebar = document.getElementById("sidebar");
      const hamburger = document.querySelector(".hamburger");
      let mode = "login";

      function toggleSidebar() {
        const isOpen = sidebar.classList.toggle("open");
        hamburger.classList.toggle("is-open", isOpen);
        hamburger.setAttribute("aria-expanded", String(isOpen));
      }

      document.addEventListener("click", (event) => {
        if (!sidebar.contains(event.target) && !hamburger.contains(event.target) && sidebar.classList.contains("open")) {
          toggleSidebar();
        }
      });

      const setMode = (newMode) => {
        mode = newMode;
        loginTab.classList.toggle("active", mode === "login");
        signupTab.classList.toggle("active", mode === "signup");
        submitButton.textContent = mode === "login" ? "Log in" : "Sign up";
        errorText.style.display = "none";
        successText.style.display = "none";
        document.getElementById("username").focus();
      };

      const postAuth = async (url, body) => {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        return res.json().then((data) => ({ ok: res.ok, data }));
      };

      const getRedirectTarget = () => {
        const redirect = new URLSearchParams(window.location.search).get("redirect");
        return redirect && redirect.startsWith("/") ? redirect : "/chat";
      };

      const redirectTarget = getRedirectTarget();
      document.getElementById("redirectTarget").value = redirectTarget;
      if (redirectTarget !== "/chat") {
        document.getElementById("noticeText").textContent = "After signing in, you will return to the page you were trying to visit.";
      }

      togglePassword.addEventListener("click", () => {
        const showing = passwordInput.type === "text";
        passwordInput.type = showing ? "password" : "text";
        togglePassword.textContent = showing ? "Show" : "Hide";
        passwordInput.focus();
      });

      authForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorText.style.display = "none";
        successText.style.display = "none";

        const username = document.getElementById("username").value.trim();
        const password = passwordInput.value.trim();
        if (!username || !password) {
          errorText.textContent = "Username and password are required.";
          errorText.style.display = "block";
          return;
        }

        const endpoint = mode === "login" ? "/api/auth/login" : "/api/auth/signup";
        const result = await postAuth(endpoint, { username, password, redirect: document.getElementById("redirectTarget").value });

        if (!result.ok) {
          errorText.textContent = result.data.error || "Unable to sign in.";
          errorText.style.display = "block";
          return;
        }

        successText.textContent = mode === "signup" ? "Account created. Redirecting..." : "Logged in. Redirecting...";
        successText.style.display = "block";
        setTimeout(() => {
          window.location.href = result.data.redirect || getRedirectTarget();
        }, 650);
      });

      loginTab.addEventListener("click", () => setMode("login"));
      signupTab.addEventListener("click", () => setMode("signup"));
    </script>
  </body>
</html>
