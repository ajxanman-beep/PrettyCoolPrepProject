<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PARALLAX Chat</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap");

      :root {
        color-scheme: dark;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top left, rgba(43, 255, 134, 0.16), transparent 28%),
          radial-gradient(circle at bottom right, rgba(0, 255, 85, 0.12), transparent 24%),
          #020402;
        color: #e5ffee;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        overflow-x: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page-wrap {
        width: min(1180px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 4.5rem 2rem 4rem 2rem;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .brand {
        display: flex;
        flex-direction: column;
      }

      .brand h1 {
        margin: 0;
        font-family: "Orbitron", sans-serif;
        font-size: 2rem;
        letter-spacing: 0.04em;
        color: #7dff9a;
      }

      .brand p {
        margin: 0.4rem 0 0;
        color: #c7ffd9;
      }

      .button,
      .logout-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0.95rem 1.4rem;
        border: 1px solid rgba(125, 255, 154, 0.28);
        background: rgba(17, 30, 16, 0.82);
        color: #b9ffd4;
        font-weight: 600;
        cursor: pointer;
      }

      .chat-panel {
        display: grid;
        gap: 1.5rem;
      }

      .chat-box {
        background: rgba(10, 16, 11, 0.92);
        border: 1px solid rgba(125, 255, 154, 0.16);
        border-radius: 32px;
        padding: 1.5rem;
        min-height: 520px;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.28);
      }

      .messages {
        display: grid;
        gap: 1rem;
        max-height: 420px;
        overflow-y: auto;
        padding-right: 0.25rem;
      }

      .message {
        padding: 1rem 1.15rem;
        border-radius: 22px;
        background: rgba(36, 58, 37, 0.92);
        border: 1px solid rgba(89, 255, 130, 0.16);
      }

      .message strong {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 0.95rem;
        color: #d9ffdf;
      }

      .message span {
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
        word-break: break-word;
        color: #c6ffd4;
        line-height: 1.7;
      }

      .message time {
        display: block;
        margin-top: 0.7rem;
        font-size: 0.82rem;
        color: #87fca0;
      }

      .chat-form {
        display: grid;
        gap: 1rem;
      }

      .chat-form textarea {
        width: 100%;
        border-radius: 18px;
        border: 1px solid rgba(125, 255, 154, 0.18);
        background: rgba(11, 22, 12, 0.92);
        color: #e5ffee;
        padding: 1rem 1.1rem;
        font: inherit;
        resize: vertical;
        min-height: 120px;
      }

      .chat-form-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .chat-form button {
        border: none;
        border-radius: 999px;
        padding: 1rem 1.4rem;
        font-weight: 700;
        background: linear-gradient(135deg, #3bff5a 0%, #0cb45e 100%);
        color: #041107;
        cursor: pointer;
        transition: transform 0.15s ease;
      }

      .chat-form button:hover {
        transform: translateY(-1px);
      }

      .section-title {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        color: #d4ffda;
      }

      .section-description {
        margin: 0.6rem 0 0;
        color: #c7ffd7;
        max-width: 42rem;
      }

      .user-note {
        margin: 1rem 0 0;
        color: #b6ffd3;
        font-size: 0.95rem;
      }

      @media (max-width: 900px) {
        .chat-box {
          min-height: 420px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-wrap">
      <div class="topbar">
        <div class="brand">
          <h1>PARALLAX</h1>
          <p>Chat Room</p>
        </div>
        <div style="display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center;">
          <button class="logout-button" id="logoutButton">Logout</button>
          <a class="button" href="/">Home</a>
        </div>
      </div>

      <div class="chat-panel">
        <div>
          <p class="section-title">Live chat</p>
          <p class="section-description">Send messages to the community and keep conversation simple, calm, and readable.</p>
          <p class="user-note" id="userNote">Loading user…</p>
        </div>

        <div class="chat-box">
          <div class="messages" id="messages"></div>

          <form class="chat-form" id="chatForm">
            <textarea id="messageInput" placeholder="Write a message..." required></textarea>
            <div class="chat-form-row">
              <div></div>
              <button type="submit">Send message</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      const messagesEl = document.getElementById("messages");
      const chatForm = document.getElementById("chatForm");
      const messageInput = document.getElementById("messageInput");
      const userNote = document.getElementById("userNote");
      const logoutButton = document.getElementById("logoutButton");
      let username = "";

      async function loadUser() {
        const res = await fetch("/api/auth/me");
        if (!res.ok) {
          window.location.href = "/auth";
          return;
        }
        const data = await res.json();
        username = data.username;
        userNote.textContent = `Signed in as ${username}`;
      }

      async function loadMessages() {
        const res = await fetch("/api/chat/messages");
        if (!res.ok) {
          window.location.href = "/auth";
          return;
        }
        const data = await res.json();
        messagesEl.innerHTML = "";
        data.messages.forEach((message) => {
          const messageEl = document.createElement("div");
          messageEl.className = "message";

          const author = document.createElement("strong");
          author.textContent = message.name;

          const text = document.createElement("span");
          text.textContent = message.message;
          text.title = message.message;

          const time = document.createElement("time");
          time.textContent = new Date(message.timestamp).toLocaleString();

          messageEl.appendChild(author);
          messageEl.appendChild(text);
          messageEl.appendChild(time);
          messagesEl.appendChild(messageEl);
        });
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      async function sendMessage(event) {
        event.preventDefault();
        const message = messageInput.value.trim();
        if (!message) return;

        const res = await fetch("/api/chat/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        if (!res.ok) {
          window.location.href = "/auth";
          return;
        }

        messageInput.value = "";
        await loadMessages();
      }

      async function logout() {
        await fetch("/api/auth/logout", { method: "POST" });
        window.location.href = "/auth";
      }

      chatForm.addEventListener("submit", sendMessage);
      logoutButton.addEventListener("click", logout);

      loadUser().then(loadMessages);
      setInterval(loadMessages, 5000);
    </script>
  </body>
</html>
